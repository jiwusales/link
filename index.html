<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JIWU 吉物販售</title>

<style>
*{box-sizing:border-box}
:root{
  --main:#A9684C;
  --bg:#fafafa;
  --text:#333;
  --sub:#777;
}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Segoe UI",sans-serif;
}
.page{
  width:100%;
  max-width:520px;
  min-height:100vh;
  margin:auto;
  padding:55px 22px 50px;
}
.profile{text-align:center}
.logo{
  width:110px;
  height:110px;
  border-radius:50%;
  object-fit:cover;
}
.name{
  margin-top:18px;
  font-size:20px;
  font-weight:800;
}
.bio{
  margin-top:8px;
  font-size:15px;
  line-height:1.8;
  white-space:pre-line;
}
.socials{
  display:flex;
  justify-content:center;
  gap:25px;
  margin:24px 0 32px;
}
.social{
  min-width:95px;
  color:var(--main);
  text-decoration:none;
  text-align:center;
}
.social-icon{
  font-size:27px;
  font-weight:700;
  line-height:1;
}
.social-name{
  margin-top:7px;
  font-size:12px;
}
.social-count{
  margin-top:2px;
  font-size:15px;
  font-weight:800;
}
.links{
  display:flex;
  flex-direction:column;
  gap:15px;
}
.link{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:52px;
  padding:10px 45px;
  border:2px solid var(--main);
  border-radius:16px;
  background:#fff;
  color:var(--main);
  text-decoration:none;
  text-align:center;
  font-size:16px;
  font-weight:700;
  transition:.15s;
}
.link:active{
  transform:scale(.98);
  background:#fff7f2;
}
.link-icon{
  position:absolute;
  left:17px;
  width:25px;
  height:25px;
  object-fit:contain;
}
.footer{
  margin-top:30px;
  text-align:center;
  color:#bbb;
  font-size:11px;
}
@media(max-width:380px){
  .page{padding-left:15px;padding-right:15px}
  .link{font-size:14px}
}
</style>
</head>

<body>

<div class="page">

  <div class="profile">

    <img id="logo" class="logo">

    <div id="name" class="name"></div>
    <div id="bio" class="bio"></div>

    <div class="socials">

      <a id="igLink" class="social" target="_blank">
        <div class="social-icon">◎</div>
        <div class="social-name">Instagram</div>
        <div id="igCount" class="social-count"></div>
      </a>

      <a id="threadsLink" class="social" target="_blank">
        <div class="social-icon">@</div>
        <div class="social-name">Threads</div>
        <div id="threadsCount" class="social-count"></div>
      </a>

    </div>

  </div>

  <div id="links" class="links"></div>

  <div class="footer">
    JIWU © <span id="year"></span>
  </div>

</div>

<script>

/* ==================================================
   ↓↓↓ 以後只要修改這個區域 ↓↓↓
================================================== */

const CONFIG={

  logo:"https://jiwusales.github.io/imgh/images/20260912_181242.png",

  name:"JIWU吉物販售",

  bio:`花花ㄉ快樂寶寶吉散地 𓂃𓈒𓏸
下面有連結可以找到我
台中朋朋歡迎自取 ☆`,

  instagram:{
  url:"https://www.instagram.com/jiwu_sales/"
},

threads:{
  url:"https://www.threads.com/@jiwu_sales"
},

  links:[
    {
      icon:"https://raw.githubusercontent.com/jiwusales/imgh/main/images_1350/icon_9a717cff.png",
      title:"吉物官網 ♡ 寶寶目錄在這邊",
      url:"https://jiwusales.github.io/jiwu_menu/"
    },
    {
      icon:"https://raw.githubusercontent.com/jiwusales/imgh/main/images_1350/icon_9a717cff.png",
      title:"最新開團",
      url:"https://jiwusales.github.io/jiwu_menu/NEWGOODS.html"
    },
    {
      icon:"https://jiwusales.github.io/imgh/images/20260912_165412.png",
      title:"這邊找花花 ♡",
      url:"https://line.me/R/ti/p/@tei8245t?ts=02051400&oat_content=url"
    },
    {
      icon:"https://jiwusales.github.io/imgh/images/20260912_183953.png",
      title:"LINE群傳送門",
      url:"https://line.me/ti/g2/aS1Oba3cd9F17Y4FGZGIUmCKTYsrbiXuRA5hXw?utm_source=invitation&utm_medium=link_copy&utm_campaign=default"
    },
    {
      icon:"https://jiwusales.github.io/imgh/images/20260912_180747.png",
      title:"JIWU 吉伊圖鑑",
      url:"https://jiwusales.github.io/jiwusales_chiikawa/"
    },
    {
      icon:"https://jiwusales.github.io/imgh/images/20260912_165122.png",
      title:"JIWU 自熊圖鑑",
      url:"https://jiwusales.github.io/jiwusales_nagano/"
    }
  ]

};

/* ==================================================
   ↑↑↑ 以後只要修改上面 ↑↑↑
================================================== */

const $=id=>document.getElementById(id);

$("logo").src=CONFIG.logo;
$("name").textContent=CONFIG.name;
$("bio").textContent=CONFIG.bio;

$("igLink").href=CONFIG.instagram.url;
$("threadsLink").href=CONFIG.threads.url;

async function loadFollowers(){
  const list=[
    ["igCount",CONFIG.instagram.url],
    ["threadsCount",CONFIG.threads.url]
  ];

  await Promise.all(list.map(async([id,url])=>{
    try{
      $(id).textContent="...";
      const r=await fetch(
        "https://pulse.walls.sh/profile?url="+encodeURIComponent(url)
      );
      if(!r.ok)throw new Error();
      const d=await r.json();
      $(id).textContent=d.followers!=null
        ?formatCount(d.followers)
        :"--";
    }catch(e){
      $(id).textContent="--";
    }
  }));
}

loadFollowers();

$("links").innerHTML=CONFIG.links.map(x=>`
<a class="link" href="${x.url}" target="_blank">
  ${x.icon?`<img class="link-icon" src="${x.icon}">`:""}
  <span>${x.title}</span>
</a>
`).join("");

$("year").textContent=new Date().getFullYear();

function formatCount(n){
  n=Number(n)||0;
  if(n>=10000)
    return (n/10000).toFixed(1).replace(".0","")+"萬";
  if(n>=1000)
    return (n/1000).toFixed(1).replace(".0","")+"K";
  return n.toLocaleString();
}

</script>

</body>
</html>
