<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JIWU 吉物販售</title>

<style>
*{box-sizing:border-box}
:root{
  --main:#A9684C;
  --bg:#fafafa;
  --text:#333;
}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Segoe UI",sans-serif;
}
.page{
  width:100%;
  max-width:520px;
  min-height:100vh;
  margin:auto;
  padding:25px 22px 45px;
}
.profile{text-align:center}

.logo{
  display:block;
  width:120px;
  height:auto;
  max-height:120px;
  object-fit:contain;
  margin:0 auto;
}

.name{
  margin-top:10px;
  font-size:20px;
  font-weight:800;
}
.bio{
  margin-top:8px;
  font-size:15px;
  line-height:1.8;
  white-space:pre-line;
}

.socials{
  display:flex;
  justify-content:center;
  gap:35px;
  margin:20px 0 30px;
}
.social{
  min-width:100px;
  color:var(--main);
  text-decoration:none;
  text-align:center;
}
.social-icon{
  display:block;
  width:30px;
  height:30px;
  object-fit:contain;
  margin:0 auto;
}
.social-name{
  margin-top:6px;
  font-size:12px;
}
.social-count{
  margin-top:2px;
  font-size:15px;
  font-weight:800;
  min-height:20px;
}

.links{
  display:flex;
  flex-direction:column;
  gap:15px;
}
.link{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:52px;
  padding:10px 45px;
  border:2px solid var(--main);
  border-radius:16px;
  background:#fff;
  color:var(--main);
  text-decoration:none;
  text-align:center;
  font-size:16px;
  font-weight:700;
  transition:.15s;
}
.link:active{
  transform:scale(.98);
  background:#fff7f2;
}
.link-icon{
  position:absolute;
  left:17px;
  width:25px;
  height:25px;
  object-fit:contain;
}
.footer{
  margin-top:30px;
  text-align:center;
  color:#bbb;
  font-size:11px;
}
@media(max-width:380px){
  .page{padding-left:15px;padding-right:15px}
  .link{font-size:14px}
}
</style>
</head>

<body>

<div class="page">

  <div class="profile">

    <img id="logo" class="logo">

    <div id="name" class="name"></div>
    <div id="bio" class="bio"></div>

    <div class="socials">

      <a id="igLink" class="social" target="_blank">
        <img
          class="social-icon"
          src="https://jiwusales.github.io/imgh/images/20260912_184418.png"
        >
        <div class="social-name">Instagram</div>
        <div id="igCount" class="social-count">...</div>
      </a>

      <a id="threadsLink" class="social" target="_blank">
        <img
          class="social-icon"
          src="https://jiwusales.github.io/imgh/images/20260912_184428.png"
        >
        <div class="social-name">Threads</div>
        <div id="threadsCount" class="social-count">...</div>
      </a>

    </div>

  </div>

  <div id="links" class="links"></div>

  <div class="footer">
    JIWU © <span id="2024"></span>
  </div>

</div>

<script>

/* ==================================================
   ↓↓↓ 以後主要修改這裡 ↓↓↓
================================================== */

const CONFIG={

  logo:"https://raw.githubusercontent.com/jiwusales/imgh/main/images_1350/icon_9a717cff.png",

  name:"JIWU吉物販售",

  bio:`花花ㄉ快樂寶寶吉散地 𓂃𓈒𓏸
下面有連結可以找到我
台中朋朋歡迎自取 ☆`,

  instagram:{
    url:"https://www.instagram.com/jiwu_sales/"
  },

  threads:{
    url:"https://www.threads.net/@jiwu_sales"
  },

  links:[
    {
      icon:"https://raw.githubusercontent.com/jiwusales/imgh/main/images_1350/icon_9a717cff.png",
      title:"吉物官網 ♡ 寶寶目錄在這邊",
      url:"https://jiwusales.github.io/jiwu_menu/"
    },
    {
      icon:"https://raw.githubusercontent.com/jiwusales/imgh/main/images_1350/icon_9a717cff.png",
      title:"最新開團",
      url:"https://jiwusales.github.io/jiwu_menu/NEWGOODS.html"
    },
    {
      icon:"https://jiwusales.github.io/imgh/images/20260912_165412.png",
      title:"這邊找花花 ♡",
      url:"https://line.me/R/ti/p/@tei8245t?ts=02051400&oat_content=url"
    },
    {
      icon:"https://jiwusales.github.io/imgh/images/20260912_183953.png",
      title:"LINE群傳送門",
      url:"https://line.me/ti/g2/aS1Oba3cd9F17Y4FGZGIUmCKTYsrbiXuRA5hXw?utm_source=invitation&utm_medium=link_copy&utm_campaign=default"
    },
    {
      icon:"https://jiwusales.github.io/imgh/images/20260912_184702.png",
      title:"JIWU 吉伊卡哇圖鑑",
      url:"https://jiwusales.github.io/jiwusales_chiikawa/"
    },
    {
      icon:"https://jiwusales.github.io/imgh/images/20260912_165122.png",
      title:"JIWU 白熊圖鑑",
      url:"https://jiwusales.github.io/jiwusales_nagano/"
    }
  ]
};

/* ==================================================
   ↑↑↑ 以後主要修改到這裡 ↑↑↑
================================================== */

const FOLLOWER_API=
"https://script.google.com/macros/s/AKfycby40cWwvCULzxaKi6eO22sa9aYwuD8hHkvk6lUM90sQSKjr9r-4CCRUq09NUM-wd0e9/exec";

const $=id=>document.getElementById(id);

/* 頁面資料 */
$("logo").src=CONFIG.logo;
$("name").textContent=CONFIG.name;
$("bio").textContent=CONFIG.bio;

$("igLink").href=CONFIG.instagram.url;
$("threadsLink").href=CONFIG.threads.url;

$("links").innerHTML=CONFIG.links.map(x=>`
<a class="link" href="${x.url}" target="_blank">
  <img class="link-icon" src="${x.icon}">
  <span>${x.title}</span>
</a>
`).join("");

$("year").textContent=new Date().getFullYear();


/* ==================================================
   追蹤人數
================================================== */

function formatCount(n){
  n=Number(n);

  if(!Number.isFinite(n))
    return "--";

  if(n>=10000)
    return (n/10000).toFixed(1).replace(".0","")+"萬";

  if(n>=1000)
    return (n/1000).toFixed(1).replace(".0","")+"K";

  return n.toLocaleString();
}

window.followerResult=function(d){

  console.log("GAS 回傳：",d);

  $("igCount").textContent=
    d?.instagram!=null
      ?formatCount(d.instagram)
      :"--";

  $("threadsCount").textContent=
    d?.threads!=null
      ?formatCount(d.threads)
      :"--";
};

function loadFollowers(){

  $("igCount").textContent="...";
  $("threadsCount").textContent="...";

  const s=document.createElement("script");

  s.src=
    FOLLOWER_API+
    "?callback=followerResult"+
    "&ig="+encodeURIComponent(CONFIG.instagram.url)+
    "&threads="+encodeURIComponent(CONFIG.threads.url)+
    "&t="+Date.now();

  s.onerror=()=>{
    $("igCount").textContent="--";
    $("threadsCount").textContent="--";
  };

  document.body.appendChild(s);
}

loadFollowers();

</script>

</body>
</html>
